# Actions GitHub figées par empreinte (SHA) : une étiquette « v4 » peut être
# déplacée par qui contrôle l'action, pas une empreinte.  Dependabot propose
# les mises à jour, une par une, à relire, et seulement une semaine après
# leur parution : une version piégée est en général repérée et retirée avant.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
