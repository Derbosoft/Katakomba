name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche rend le passage précédent caduc.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Suite de tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Python système : python3-gi n'existe que pour lui.
      - name: Dépendances (GTK 4, libadwaita, écran virtuel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 librsvg2-common xvfb

      # unittest directement, sans run-tests.sh : son empreinte réseau
      # avant/après protège une machine réelle, mais sur un runner l'hôte
      # change d'interfaces de lui-même.  tests/test_safety.py garantit
      # toujours qu'aucun test n'exécute de commande système.
      - name: Tests
        env:
          DISPLAY: ":99"
          GTK_A11Y: none
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          python3 -W ignore::ResourceWarning -m unittest discover -s tests -t . -v

  # Ce que les tests ne voient pas : scripts bash lancés en root
  # (ShellCheck), noms et imports morts côté Python (Ruff, ruff.toml), et
  # ces workflows eux-mêmes, qui signent les versions publiées (zizmor).
  analyse:
    name: Analyse statique
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Outils (figés par empreinte, outils/analyse.txt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m venv "$RUNNER_TEMP/outils"
          "$RUNNER_TEMP/outils/bin/pip" install --require-hashes --only-binary :all: \
            -r outils/analyse.txt

      - name: ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' packaging/postinst packaging/prerm packaging/postrm \
            | xargs -0 shellcheck

      - name: Ruff
        run: '"$RUNNER_TEMP/outils/bin/ruff" check --no-cache .'

      # En ligne : vérifie aussi que chaque empreinte d'action existe dans
      # le dépôt annoncé et qu'aucune version figée n'a de faille connue.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/outils/bin/zizmor" --persona=auditor .github/'

  # Vrai noyau, dans un espace réseau neuf (tests_noyau/lancer.sh) : vraies
  # routes, vraies règles iptables, vraies connexions, et le vrai binaire
  # OpenVPN face au modèle de lecture du fuzzer.  En root : le passe-droit de
  # Tor (--uid-owner) n'est vérifiable qu'ici.
  noyau:
    name: Vrai noyau
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openvpn
          openvpn --version | head -1

      - name: Vérifications
        run: sudo bash tests_noyau/lancer.sh -v

  paquet:
    name: Paquet .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validation AppStream et lanceur
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --no-net packaging/org.katakomba.Katakomba.metainfo.xml
          desktop-file-validate packaging/org.katakomba.Katakomba.desktop

      - name: build-deb.sh
        run: bash packaging/build-deb.sh

      # Construction reproductible : un second passage, depuis une autre copie
      # et avec un autre umask, doit donner les mêmes octets.
      - name: Reproductibilité
        run: |
          sha256sum dist/*.deb | sed 's| dist/| |' | sort > /tmp/premier
          cp -a . /tmp/copie && rm -rf /tmp/copie/dist
          (cd /tmp/copie && umask 077 && bash packaging/build-deb.sh >/dev/null)
          sha256sum /tmp/copie/dist/*.deb | sed 's| /tmp/copie/dist/| |' | sort > /tmp/second
          cat /tmp/premier
          diff /tmp/premier /tmp/second

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: katakomba-deb
          path: dist/*.deb

  # Les paquets installés pour de vrai sur un Ubuntu neuf : dépendances,
  # postinst (install.sh en mode paquet), console, passage d'une variante à
  # l'autre et purge.  Le service n'est jamais démarré (aucun fournisseur).
  installation:
    name: Installation des paquets
    needs: paquet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: katakomba-deb
          path: dist

      - name: Sans interface (serveur)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/katakomba-headless_*_all.deb
          systemctl is-enabled katakomba
          test ! -e /opt/katakomba/main.py
          test ! -e /usr/share/applications/org.katakomba.Katakomba.desktop
          if katakomba gui; then exit 1; fi
          katakomba help | grep -q "provider"
          sudo katakomba exclude add 10.1.2.3
          sudo katakomba set kill-switch off
          sudo katakomba provider list
          sudo grep -q '"10.1.2.3/32"' /etc/katakomba/config.json
          test "$(sudo stat -c '%a %G' /etc/katakomba/config.json)" = "660 katakomba"

      - name: Passage à la version avec interface
        run: |
          sudo apt-get install -y ./dist/katakomba_*_all.deb
          test -e /opt/katakomba/main.py
          test -e /usr/share/applications/org.katakomba.Katakomba.desktop
          sudo grep -q '"10.1.2.3/32"' /etc/katakomba/config.json
          systemctl is-enabled katakomba
          # Variante remplacée, restée « à purger » : sa purge n'efface rien.
          if dpkg-query -W -f='${Status}' katakomba-headless 2>/dev/null | grep -q config-files; then
              sudo dpkg --purge katakomba-headless
          fi
          sudo grep -q '"10.1.2.3/32"' /etc/katakomba/config.json
          test -e /opt/katakomba/constants.py

      - name: Purge
        run: |
          sudo apt-get purge -y katakomba
          test ! -e /etc/katakomba
          test ! -e /opt/katakomba
          test ! -e /etc/systemd/system/katakomba.service
